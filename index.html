<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,sans-serif;background:#f9f9f7;color:#1a1a1a}
body{display:flex;flex-direction:column;padding:0.75rem;height:100vh}
.tabs{display:flex;gap:4px;border-bottom:1px solid #e0e0d8;flex-wrap:wrap;flex-shrink:0}
.tab{padding:8px 22px;font-size:13px;font-weight:500;border-radius:8px 8px 0 0;cursor:pointer;border:1px solid transparent;color:#666;background:transparent;transition:all .15s}
.tab.active{background:#fff;border-color:#e0e0d8;border-bottom-color:#fff;color:#1a1a1a}
.tab:hover:not(.active){background:#f0f0ea}
.pages{flex:1;min-height:0;position:relative}
.page{display:none;position:absolute;inset:0;flex-direction:column;padding:0.75rem 0}
.page.active{display:flex}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-shrink:0}
.stats{display:flex;gap:16px;font-size:12px;color:#888}
.stats span{font-weight:500}
.reset-btn{padding:6px 14px;font-size:12px;border-radius:8px;border:1px solid #ccc;background:transparent;cursor:pointer;color:#666}
.reset-btn:hover{background:#f0f0ea}
.table-wrap{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;margin-bottom:0.75rem}
.col-table{display:flex;width:100%;border:1px solid #e0e0d8;border-radius:10px;overflow:hidden}
.col{flex:1;width:0;display:flex;flex-direction:column;border-right:1px solid #e0e0d8}
.col:last-child{border-right:none}
.col-header{font-size:11px;font-weight:600;color:#444;background:#f0f0ea;padding:10px 8px;text-align:center;border-bottom:1px solid #e0e0d8;line-height:1.3;flex-shrink:0}
.drop-zone{min-height:80px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
.drop-zone.dragover{background:#e6f1fb}
.bank-section{flex-shrink:0}
.divider{border:none;border-top:1px dashed #ccc;margin:0 0 0.75rem}
.bank-title{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;max-height:180px;overflow-y:auto;padding:8px;border-radius:8px;border:1px dashed #ccc;background:#f0f0ea}
.card{background:#fff;border:1px solid #e0e0d8;border-radius:8px;padding:7px 9px;font-size:11px;line-height:1.4;cursor:grab;color:#1a1a1a;user-select:none}
.card:hover{box-shadow:0 2px 5px rgba(0,0,0,.08)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card.correct{background:#eaf3de;border-color:#7ab648;color:#3b6d11}
.card.wrong{background:#fcebeb;border-color:#e24b4a;color:#a32d2d}
.remove-btn{float:right;font-size:10px;cursor:pointer;padding:1px 4px;border-radius:3px;border:1px solid #ccc;background:transparent;color:#888;margin-left:4px;line-height:1.3}
.remove-btn:hover{background:#f0f0ea}
</style>
</head>

</div>
<div class="pages">

a'},{id:'p35',text:'Canalizar las órdenes formales del CECOPAL, respecto a los Coordinadores de las Unidades Básicas.',zone:'pma'},{id:'p36',text:'Coordinar las solicitudes de recursos.',zone:'pma'},{id:'p37',text:'Dependiendo de la evolución de la emergencia, prever los puntos de encuentro para evacuaciones así como lugares de recogida de medios y recursos.',zone:'pma'}]},pamri:{zones:[{id:'cecopal',label:'CECOPAL'},{id:'dir',label:'Director del Plan'},{id:'comite',label:'Comité Asesor'},{id:'gabinete',label:'Gabinete de Información'},{id:'cecom',label:'CECOM'},{id:'pma',label:'PMA'}],cards:[{id:'r1',text:'Gestionar y canalizar los recursos municipales de forma coordinada con el PMA.',zone:'cecopal'},{id:'r2',text:'Coordinar el sistema de avisos a la población y otras medidas de protección.',zone:'cecopal'},{id:'r3',text:'Recibir la información del riesgo y activar el Plan en su fase de preemergencia y/o emergencia.',zone:'dir'},{id:'r4',text:'Convocar a los miembros del Comité Asesor que considere necesarios en cada situación.',zone:'dir'},{id:'r5',text:'Decidir en cada momento, y con el consejo del Comité Asesor, las actuaciones más convenientes para hacer frente a la emergencia, y la aplicación de las medidas de protección a la población, al medio ambiente, a los bienes y al personal adscrito al Plan.',zone:'dir'},{id:'r6',text:'Dar la orden de evacuación, en su caso, o proponerla al Director del Plan Especial.',zone:'dir'},{id:'r7',text:'Facilitar el avituallamiento de víveres y artículos de primera necesidad.',zone:'dir'},{id:'r8',text:'Mantener comunicación con el CCE de Generalitat y solicitar en su caso la intervención de medios y recursos externos al municipio.',zone:'dir'},{id:'r9',text:'Determinar y coordinar la información a la población durante la emergencia, a través de los medios propios del Plan y de los medios locales de comunicación social.',zone:'dir'},{id:'r10',text:'Ordenar las actuaciones pertinentes para restituir la normalidad, una vez final rsos adscritos al PAM RI que haya ordenado su Dirección.',zone:'cecom'},{id:'r36',text:'Mantener constancia escrita de la gestión realizada por parte de la Central de Comunicaciones/CECOPAL.',zone:'cecom'},{id:'r37',text:'Preemergencia: Recibir y transmitir la alerta sobre lluvias intensas al Director del Plan, miembros del CECOPAL y resto de personal adscrito al Plan.',zone:'cecom'},{id:'r38',text:'Preemergencia: Transmitir la alerta a los responsables del seguimiento de lluvias (si se dispone de pluviómetros).',zone:'cecom'},{id:'r39',text:'Preemergencia: Trasladar la alerta a los servicios básicos municipales.',zone:'cecom'},{id:'r40',text:'Preemergencia: Efectuar el seguimiento de la evolución de las precipitaciones y caudales en las cuencas de los cauces que discurren por el municipio.',zone:'cecom'},{id:'r41',text:'Preemergencia: Recabar información sobre la evolución de los caudales proporcionada por el servicio responsable del mismo (Unidad Básica de Seguridad, voluntarios).',zone:'cecom'},{id:'r42',text:'Preemergencia: Mantener informado al Director del Plan e informar al CCE de la situación en el municipio, así como recabar información de retorno sobre la situación en las cuencas de los cauces correspondientes.',zone:'cecom'},{id:'r43',text:'Emergencia: Continuar con las labores descritas en preemergencia.',zone:'cecom'},{id:'r44',text:'Emergencia: Convocar a los miembros del CECOPAL que determine el Director del Plan. Trasladar la alerta a los servicios básicos municipales.',zone:'cecom'},{id:'r45',text:'Emergencia: Recabar información sobre el estado de las carreteras que sirven de comunicación con otras poblaciones.',zone:'cecom'},{id:'r46',text:'Emergencia: Recabar información de la Unidad Básica de Seguridad sobre el estado de las vías de comunicación del término.',zone:'cecom'},{id:'r47',text:'Emergencia: Mantener constancia escrita de la gestión del Centro de Comunicaciones. Informar al CCE.',zone:'cecom'},{id:'r48',text:'Ubicar y constituir el PMA const state={};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initPage(pid){
  const data=DATA[pid];const placed={};
  data.zones.forEach(z=>placed[z.id]=[]);
  state[pid]={bank:shuffle(data.cards.map(c=>c.id)),placed,data,fallos:0};
  renderPage(pid);
}

function renderPage(pid){
  const {bank,placed,data,fallos}=state[pid];
  const el=document.getElementById(pid);
  const total=data.cards.length;
  const correct=data.zones.reduce((s,z)=>s+placed[z.id].filter(id=>{const c=data.cards.find(x=>x.id===id);return c&&c.zone===z.id;}).length,0);
  const wrong=data.zones.reduce((s,z)=>s+placed[z.id].filter(id=>{const c=data.cards.find(x=>x.id===id);return c&&c.zone!==z.id;}).length,0);

  let html=`<div class="header-bar">
    <div class="stats">
      <div>Colocadas: <span>${total-bank.length}/${total}</span></div>
      <div>Correctas: <span style="color:#3b6d11">${correct}</span></div>
      <div>En rojo: <span style="color:#a32d2d">${wrong}</span></div>
      <div>Fallos acumulados: <span style="color:#a32d2d">${fallos}</span></div>
    </div>
    <button class="reset-btn" onclick="initPage('${pid}')">Reiniciar</button>
  </div>
  <div class="table-wrap"><div class="col-table">`;

  data.zones.forEach(z=>{
    html+=`<div class="col">
      <div class="col-header">${z.label}</div>
      <div class="drop-zone" id="zone-${pid}-${z.id}" ondragover="ev(event)" ondrop="drop(event,'${pid}','${z.id}')">`;
    placed[z.id].forEach(id=>{
      const c=data.cards.find(x=>x.id===id);
      const ok=c.zone===z.id;
      html+=`<div class="card ${ok?'correct':'wrong'}" id="card-${id}" draggable="true" ondragstart="drag(event,'${id}')">
        <button class="remove-btn" onclick="removeCard('${pid}','${z.id}','${id}')">✕</button>${c.text}</div>`;
    });
    html+=`</div></div>`;
  });

  html+=`</div></div>
  <hr class="divider">
  <div class="bank-section">
    <div class="bank-title">Funciones por colocar</div>
    <div class="bank" id="bank-${pid}" ondragover="ev(event)" ondrop="drop(event,'${pid}','__bank__')">`;
  bank.forEach(id=>{
    const c=data.cards.find(x=>x.id===id);
    html+=`<div class="card" id="card-${id}" draggable="true" ondragstart="drag(event,'${id}')">${c.text}</div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

let dragging=null;
function drag(e,id){dragging=id;setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.classList.add('dragging');},0)}
function ev(e){e.preventDefault()}
function drop(e,pid,zid){
  e.preventDefault();if(!dragging)return;
  const s=state[pid];const{bank,placed,data}=s;
  const card=data.cards.find(c=>c.id===dragging);
  if(!card){dragging=null;return;}
  const fromBank=bank.includes(dragging);
  const bi=bank.indexOf(dragging);if(bi>-1)bank.splice(bi,1);
  data.zones.forEach(z=>{const i=placed[z.id].indexOf(dragging);if(i>-1)placed[z.id].splice(i,1);});
  if(zid==='__bank__'){bank.push(dragging);}
  else{placed[zid].push(dragging);if(fromBank&&card.zone!==zid)s.fallos++;}
  dragging=null;renderPage(pid);
}
function removeCard(pid,zid,id){
  const{bank,placed}=state[pid];
  const i=placed[zid].indexOf(id);if(i>-1){placed[zid].splice(i,1);bank.unshift(id);}
  renderPage(pid);
}
function showPage(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{const p=['pamif','pte','pamri'];t.classList.toggle('active',p[i]===id);});
  document.querySelectorAll('.page').forEach(p=>{p.classList.toggle('active',p.id===id);});
  if(!state[id])initPage(id);
}
initPage('pamif');
</script>

const state={};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initPage(pid){
  const data=DATA[pid];const placed={};
  data.zones.forEach(z=>placed[z.id]=[]);
  state[pid]={bank:shuffle(data.cards.map(c=>c.id)),placed,data,fallos:0};
  renderPage(pid);
}

function renderPage(pid){
  const {bank,placed,data,fallos}=state[pid];
  const el=document.getElementById(pid);
  const total=data.cards.length;
  const correct=data.zones.reduce((s,z)=>s+placed[z.id].filter(id=>{const c=data.cards.find(x=>x.id===id);return c&&c.zone===z.id;}).length,0);
  const wrong=data.zones.reduce((s,z)=>s+placed[z.id].filter(id=>{const c=data.cards.find(x=>x.id===id);return c&&c.zone!==z.id;}).length,0);

  let html=`<div class="header-bar">
    <div class="stats">
      <div>Colocadas: <span>${total-bank.length}/${total}</span></div>
      <div>Correctas: <span style="color:#3b6d11">${correct}</span></div>
      <div>En rojo: <span style="color:#a32d2d">${wrong}</span></div>
      <div>Fallos acumulados: <span style="color:#a32d2d">${fallos}</span></div>
    </div>
    <button class="reset-btn" onclick="initPage('${pid}')">Reiniciar</button>
  </div>
  <div class="table-wrap"><div class="col-table">`;

  data.zones.forEach(z=>{
    html+=`<div class="col">
      <div class="col-header">${z.label}</div>
      <div class="drop-zone" id="zone-${pid}-${z.id}" ondragover="ev(event)" ondrop="drop(event,'${pid}','${z.id}')">`;
    placed[z.id].forEach(id=>{
      const c=data.cards.find(x=>x.id===id);
      const ok=c.zone===z.id;
      html+=`<div class="card ${ok?'correct':'wrong'}" id="card-${id}" draggable="true" ondragstart="drag(event,'${id}')">
        <button class="remove-btn" onclick="removeCard('${pid}','${z.id}','${id}')">✕</button>${c.text}</div>`;
    });
    html+=`</div></div>`;
  });

  html+=`</div></div>
  <hr class="divider">
  <div class="bank-section">
    <div class="bank-title">Funciones por colocar</div>
    <div class="bank" id="bank-${pid}" ondragover="ev(event)" ondrop="drop(event,'${pid}','__bank__')">`;
  bank.forEach(id=>{
    const c=data.cards.find(x=>x.id===id);
    html+=`<div class="card" id="card-${id}" draggable="true" ondragstart="drag(event,'${id}')">${c.text}</div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

let dragging=null;
function drag(e,id){dragging=id;setTimeout(()=>{const el=document.getElementById('card-'+id);if(el)el.classList.add('dragging');},0)}
function ev(e){e.preventDefault()}
function drop(e,pid,zid){
  e.preventDefault();if(!dragging)return;
  const s=state[pid];const{bank,placed,data}=s;
  const card=data.cards.find(c=>c.id===dragging);
  if(!card){dragging=null;return;}
  const fromBank=bank.includes(dragging);
  const bi=bank.indexOf(dragging);if(bi>-1)bank.splice(bi,1);
  data.zones.forEach(z=>{const i=placed[z.id].indexOf(dragging);if(i>-1)placed[z.id].splice(i,1);});
  if(zid==='__bank__'){bank.push(dragging);}
  else{placed[zid].push(dragging);if(fromBank&&card.zone!==zid)s.fallos++;}
  dragging=null;renderPage(pid);
}
function removeCard(pid,zid,id){
  const{bank,placed}=state[pid];
  const i=placed[zid].indexOf(id);if(i>-1){placed[zid].splice(i,1);bank.unshift(id);}
  renderPage(pid);
}
function showPage(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{const p=['pamif','pte','pamri'];t.classList.toggle('active',p[i]===id);});
  document.querySelectorAll('.page').forEach(p=>{p.classList.toggle('active',p.id===id);});
  if(!state[id])initPage(id);
}
initPage('pamif');
</script>
